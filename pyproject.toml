[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "geobr-tools"
version = "0.1.0"
description = "Ferramentas geodésicas para o Brasil: UTM, SAD 69 ↔ SIRGAS 2000, fator de escala, áreas e DMS."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Maessa Oliveira" }]
requires-python = ">=3.9"
dependencies = ["geographiclib>=2.0"]
keywords = ["geodesia", "topografia", "utm", "sirgas2000", "sad69", "gis", "brasil", "survey"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "Natural Language :: Portuguese (Brazilian)",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: GIS",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "pyproj>=3.6", "ruff>=0.5"]
docs = ["mkdocs-material>=9.5", "mkdocstrings[python]>=0.25"]

[project.scripts]
geobr = "geobr_tools.cli:main"

[project.urls]
Homepage = "https://github.com/maessa-oliveira/geobr-tools"
Documentation = "https://maessa-oliveira.github.io/geobr-tools/"
Issues = "https://github.com/maessa-oliveira/geobr-tools/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/geobr_tools"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E741"]
