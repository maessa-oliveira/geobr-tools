site_name: geobr-tools
site_description: Ferramentas geodésicas para o Brasil
site_author: Maessa Oliveira
repo_url: https://github.com/maessa-oliveira/geobr-tools
theme:
  name: material
  language: pt-BR
  palette:
    - scheme: default
      primary: teal
      toggle: {icon: material/brightness-7, name: Modo escuro}
    - scheme: slate
      primary: teal
      toggle: {icon: material/brightness-4, name: Modo claro}
  features: [content.code.copy, navigation.sections]
plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            show_source: false
            docstring_style: google
            heading_level: 3
markdown_extensions:
  - admonition
  - pymdownx.highlight
  - pymdownx.superfences
  - tables
nav:
  - Início: index.md
  - Guia rápido: guia.md
  - Referência da API: api.md
  - Validação: validacao.md
